# This library appears to be unmaintained, yet it is great and stable for 2KB.
# @todo consider forking it as a module asset to expose private function/methods
# and minimize dup ones to likely 1KB gzip at 3.+. Unless the author modernizes
# it with IO, etc. by then.
# @todo adjust weights to use hundredth decimals.
blazy:
  header: true
  remote: https://github.com/dinbror/blazy
  version: 1.x
  license:
    name: MIT
    url: https://github.com/dinbror/blazy/blob/master/LICENSE
    gpl-compatible: true
  js:
    /libraries/blazy/blazy.min.js: { minified: true, weight: -5 }

# Re-usable library, even for Ultimenu, or any module wish to have vanilla.
dblazy:
  js:
    js/base/blazy.polyfills.min.js: { minified: true, weight: -5 }
    js/dblazy.min.js: { minified: true, weight: -4 }

# Extension for dBlazy, not currently used.
css:
  js:
    js/plugin/blazy.css.min.js: { minified: true, weight: -3 }
  dependencies:
    - blazy/dblazy

# Extension for dBlazy, non-reusable internal: BG, IO, attributes.
internal:
  js:
    js/plugin/blazy.internal.min.js: { minified: true, weight: -3 }
  dependencies:
    - blazy/dblazy

# Drupal-related base.
base:
  css:
    component:
      css/blazy.css: {}

# Shared drupal-related methods normally driven by Drupal UI options.
drupal:
  js:
    js/base/blazy.drupal.min.js: { minified: true, weight: -1.6 }
  dependencies:
    # @todo when min D9.2 - core/once
    - core/drupal
    - core/drupal.debounce
    - blazy/dblazy
    - blazy/base

# Compat methods between Native and lazyload script when being ditched.
compat:
  js:
    js/blazy.compat.min.js: { minified: true, weight: -1.6 }
  dependencies:
    - blazy/internal
    - blazy/drupal

# The blazy/compat implementations with [Intersection|Mutation|Resize]Observer.
# Not loaded if blur OFF, fluid ratio OFF, CSS BG OFF, and plain images.
# @todo refactor when the first @todo above is in.
observer:
  js:
    js/plugin/blazy.io.min.js: { minified: true, weight: -1.5 }
    js/plugin/blazy.ro.min.js: { minified: true, weight: -1.5 }
  dependencies:
    - blazy/compat

# The bLazy, IO, Native loader aka initializer for IE9+ and modern browsers.
# Not loaded when `No JavaScript` is enabled.
load:
  js:
    js/blazy.load.min.js: { minified: true, weight: -1.5 }
  dependencies:
    - blazy/blazy
    - blazy/compat
    - blazy/loading

# Alt bLazy with Intersection observer, implemented by bio.media, or IO.module.
# Not loaded when `No JavaScript` is enabled.
# @todo merge it with localized/ forked bLazy to degrade/ avoid all or nothing.
bio:
  js:
    js/components/io/bio.min.js: { minified: true, weight: -3 }
  dependencies:
    - blazy/internal

# Intersection observer media as a bLazy alternative for modern browsers only.
# Not loaded when `No JavaScript` is enabled.
# @todo merge it with localized/ forked bLazy to degrade/ avoid all or nothing
bio.media:
  js:
    js/components/io/bio.media.min.js: { minified: true, weight: -2 }
  dependencies:
    - blazy/bio

# Optional components.
loading:
  css:
    component:
      css/components/blazy.loading.css: {}
  dependencies:
    - blazy/base

filter:
  js:
    js/components/blazy.filter.min.js: { minified: true, weight: -1.6 }
  css:
    component:
      css/components/blazy.filter.css: {}
  dependencies:
    - blazy/drupal

blur:
  js:
    js/plugin/blazy.blur.min.js: { minified: true }
  css:
    component:
      css/components/blazy.blur.css: {}
  dependencies:
    - blazy/observer

media:
  js:
    js/components/blazy.media.min.js: { minified: true }
  css:
    component:
      css/components/blazy.media.css: {}
  dependencies:
    - blazy/drupal
    - blazy/ratio

oembed:
  css:
    component:
      css/components/blazy.oembed.css: {}

preview:
  css:
    component:
      css/components/blazy.preview.css: {}

ratio:
  css:
    component:
      css/components/blazy.ratio.css: {}
  dependencies:
    - blazy/base

# CSS grids.
column:
  css:
    component:
      css/components/grid/blazy.column.css: {}
  dependencies:
    - blazy/base

flex:
  css:
    component:
      css/components/grid/blazy.flex.css: {}
  js:
    js/components/grid/blazy.flex.min.js: { minified: true }
  dependencies:
    - blazy/observer

grid:
  css:
    component:
      css/components/grid/blazy.grid.css: {}
  dependencies:
    - blazy/base

nativegrid:
  css:
    component:
      css/components/grid/blazy.nativegrid.css: {}
  dependencies:
    - blazy/base

nativegrid.masonry:
  js:
    js/components/grid/blazy.nativegrid.masonry.min.js: { minified: true }
  dependencies:
    - blazy/observer
    - blazy/nativegrid

# Lightboxes.
lightbox:
  css:
    component:
      css/components/box/blazy.lightbox.css: {}
  dependencies:
    - blazy/base

blazybox:
  js:
    js/components/box/blazy.blazybox.min.js: { minified: true }
  css:
    component:
      css/components/box/blazy.blazybox.css: {}
  dependencies:
    - blazy/drupal
    - blazy/lightbox

colorbox:
  css:
    component:
      css/components/box/blazy.colorbox.css: {}
  js:
    js/components/jquery/blazy.colorbox.min.js: { minified: true }
  dependencies:
    - blazy/drupal
    - blazy/ratio
    - colorbox/colorbox

admin:
  js:
    js/components/jquery/blazy.admin.min.js: { minified: true }
  css:
    theme:
      css/components/admin/blazy.admin.css: {}
      css/components/admin/blazy.admin--fixes.css: {}
  dependencies:
    - core/jquery
    - blazy/drupal
    - blazy/dblazy

# deprecated at 2.5 and removed at 3.+, unmaintained. Use PhotoSwipe, etc.
photobox:
  remote: https://github.com/yairEO/photobox/
  version: 1.x
  license:
    name: MIT
    url: https://github.com/yairEO/photobox/issues/17
    gpl-compatible: true
  js:
    /libraries/photobox/photobox/jquery.photobox.js: {}
    js/components/jquery/blazy.photobox.min.js: { minified: true }
  css:
    base:
      /libraries/photobox/photobox/photobox.css: {}
  dependencies:
    - core/jquery
    - blazy/drupal
    - blazy/dblazy
    # use photobox when available instead.
    # - photobox/photobox

# Ajax helper for VIS, alike.
# @todo re-check and deprecate it if IO.module, etc. no longer needs it.
bio.ajax:
  js:
    js/components/io/bio.ajax.min.js: { minified: true }
  dependencies:
    - core/drupal.ajax
    # @todo revert if any issues: - blazy/load
    - blazy/drupal

# deprecated at 2.5 and removed before 3.0.0, included in blazy/colorbox.
colorbox.skin:
  css:
    component:
      css/components/box/blazy.colorbox.css: {}
  dependencies:
    - colorbox/colorbox

# deprecated at 2.5 and removed before 3.0.0, included in blazy/blur.
fx.blur:
  css:
    component:
      css/components/blazy.blur.css: {}
  dependencies:
    - blazy/blur
